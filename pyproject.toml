[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferbench-optimization-library"
version = "0.1.0"
description = "Plugin-based optimization strategy library for InferBench AutoTune"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
