[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferbench-optimization-library"
version = "0.1.0"
description = "InferBench AutoTune: ONNX benchmark engine and optimization strategy library"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "psutil",
    "fastapi",
    "uvicorn",
    "streamlit",
    "requests",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# only needed to export the MobileNet test model (scripts/makemodel.py)
modelgen = ["torch", "torchvision", "onnxscript"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["inferbench*", "inferbench_optimizers*", "models*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["test", "tests"]